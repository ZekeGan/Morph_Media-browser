<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="system-ui, 'Microsoft JhengHei', sans-serif">
  <title id="t">M:orph 資料流與行程邊界</title>
  <desc id="d">上半部：資料夾與專案設定成為可攜記錄，經專案版面顯示為卡片；兩者另產生可重建的搜尋索引。下半部：renderer、preload、main 三層，只有 main 能存取檔案系統。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8b949e" stroke-width="1.6">
    <rect x="20" y="52" width="170" height="64" rx="8"/>
    <rect x="250" y="40" width="190" height="88" rx="8"/>
    <rect x="500" y="52" width="170" height="64" rx="8"/>
    <rect x="730" y="52" width="210" height="64" rx="8"/>
    <rect x="250" y="168" width="190" height="52" rx="8" stroke-dasharray="6 4"/>
    <path d="M190 84H248" marker-end="url(#a)"/>
    <path d="M440 84H498" marker-end="url(#a)"/>
    <path d="M670 84H728" marker-end="url(#a)"/>
    <path d="M345 128V166" marker-end="url(#a)"/>
    <rect x="20" y="290" width="250" height="120" rx="8"/>
    <rect x="355" y="290" width="250" height="120" rx="8"/>
    <rect x="690" y="290" width="250" height="120" rx="8"/>
    <path d="M270 350H353" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M605 350H688" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M815 290V245H345V222" stroke-dasharray="2 5" marker-end="url(#a)"/>
  </g>
  <g fill="#8b949e" font-size="15" text-anchor="middle">
    <text x="105" y="80" font-weight="600">資料夾</text>
    <text x="105" y="100" font-size="12.5">你的原始檔案（唯讀）</text>
    <text x="345" y="72" font-weight="600">可攜記錄（資料來源）</text>
    <text x="345" y="94" font-size="12.5">每個資料夾的 folder.json</text>
    <text x="345" y="112" font-size="12.5">＋ 根目錄的專案檔與設定</text>
    <text x="585" y="80" font-weight="600">專案版面</text>
    <text x="585" y="100" font-size="12.5">欄位、組件、樣式、備用欄位</text>
    <text x="835" y="80" font-weight="600">畫面</text>
    <text x="835" y="100" font-size="12.5">卡片／表格／樹狀圖＋右側面板</text>
    <text x="345" y="192" font-weight="600">SQLite 搜尋索引</text>
    <text x="345" y="210" font-size="12.5">隨時可由記錄重建</text>
    <text x="145" y="316" font-weight="600">Renderer</text>
    <text x="145" y="338" font-size="12.5">React 畫面、草稿、互動</text>
    <text x="145" y="358" font-size="12.5">沙箱、不能讀路徑或執行命令</text>
    <text x="480" y="316" font-weight="600">Preload</text>
    <text x="480" y="338" font-size="12.5">只暴露受控的 API</text>
    <text x="480" y="358" font-size="12.5">contextIsolation 開啟</text>
    <text x="815" y="316" font-weight="600">Main</text>
    <text x="815" y="338" font-size="12.5">Library／Explorer／WorkspaceStore</text>
    <text x="815" y="358" font-size="12.5">驗證請求、讀寫檔案、啟動程式</text>
    <text x="480" y="24" font-size="13" font-weight="600">資料</text>
    <text x="480" y="270" font-size="13" font-weight="600">行程邊界</text>
    <text x="815" y="400" font-size="12" opacity=".8">只有 Main 能存取檔案系統</text>
  </g>
</svg>
